<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#243b23" />
    <meta name="description" content="PRAG — A Self-Healing RAG system" />
    <title>PRAG — A Self-Healing RAG system</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" type="module"></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="wordmark"><h1>PRAG</h1><p>A Self-Healing RAG system</p></div>
        <div class="header-tools"><span class="connection-state" id="connectionState" aria-label="Connection status"><i></i></span><button class="settings-button" id="settingsOpen" type="button" aria-label="Connection settings" title="Connection settings"><i data-lucide="settings"></i></button></div>
      </header>
      <main class="workspace">
        <section class="chat-panel" aria-label="Chat">
          <div class="chat-scroll" id="chatScroll"><div class="messages" id="messages" aria-live="polite"></div></div>
          <div class="composer-wrap">
            <div class="active-library" id="activeLibrary" hidden><span class="library-glyph"><i data-lucide="book-open"></i></span><span id="activeDbLabel"></span><button id="clearDb" type="button" title="Disconnect database" aria-label="Disconnect database"><i data-lucide="x"></i></button></div>
            <form class="composer" id="chatForm"><textarea id="questionInput" rows="1" placeholder="Message PRAG" aria-label="Message PRAG"></textarea><button class="send-button" id="sendButton" type="submit" aria-label="Send message"><i data-lucide="arrow-up"></i></button></form>
          </div>
        </section>
        <aside class="control-rail" aria-label="Document and database controls">
          <section class="rail-section upload-section">
            <label class="rail-label" for="pdfInput">PDF</label>
            <input type="file" id="pdfInput" accept="application/pdf,.pdf" hidden />
            <button class="pdf-picker" id="choosePdf" type="button"><i data-lucide="file-up"></i><span id="fileName">Choose a PDF</span></button>
            <label class="rail-label field-title" for="uploadIndexName">Vector database name</label>
            <input id="uploadIndexName" class="rail-input" placeholder="Enter database name" autocomplete="off" />
            <button class="rail-button primary" id="startUpload" type="button">Upload PDF</button>
            <div class="upload-progress" id="uploadProgress" hidden><div class="progress-track"><span id="progressFill"></span></div><span id="progressText"></span></div>
            <div class="inline-error" id="uploadError"></div>
          </section>
          <div class="rail-divider" role="separator"></div>
          <section class="rail-section existing-section">
            <label class="rail-label" for="indexName">Existing vector database</label>
            <input id="indexName" class="rail-input" placeholder="Enter database name" autocomplete="off" />
            <button class="rail-button secondary" id="librarySubmit" type="button">Load database</button>
            <div class="inline-error" id="indexError"></div>
          </section>
          <div class="rail-spacer"></div>
        </aside>
      </main>
    </div>
    <div class="toast" id="toast" role="status"></div>
    <dialog class="settings-dialog" id="settingsDialog"><form method="dialog"><div class="dialog-head"><div><div class="dialog-eyebrow">BACKEND</div><h2>Connection status</h2></div><button class="dialog-close" aria-label="Close">×</button></div>
      <p id="backendStatus" class="backend-status">Checking backend…</p>
      <label class="field-label" for="namespace">Pinecone namespace <span class="optional">(optional)</span></label><input id="namespace" class="field" placeholder="Defaults to database name" autocomplete="off" />
      <button class="save-settings" id="saveSettings" value="save">Save namespace</button>
    </form></dialog>
  </body>
</html>
